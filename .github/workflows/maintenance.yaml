# Weekly maintenance check, not required (FY-0026): the end of life of the
# nixpkgs branch. It depends on the date, so it never blocks pull requests.
name: maintenance

on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  pending:
    name: Report pending
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write # commit status of a dispatched run
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STATE: pending
          CONTEXT: maintenance
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # The script is not checked out yet; this is its one call.
        run: >-
          gh api --silent -X POST "repos/$REPO/statuses/$SHA"
          -f state="$STATE" -f context="$CONTEXT" -f target_url="$RUN_URL"
          -f description="GitHub Actions run"

  eol:
    name: End of life of the nixpkgs branch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@a90eeb051e85033f5d3c3e40dd213a585f34ec8d # v0.1.1
      - name: End of life of the nixpkgs branch
        shell: bash
        run: nix run --no-update-lock-file .#check-eol -- nixpkgs-eol

  result:
    name: maintenance
    needs: [pending, eol]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write # commit status of a dispatched run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: result
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/required.sh
      - if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          STATE: ${{ steps.result.outcome == 'success' && 'success' || 'failure' }}
          CONTEXT: maintenance
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/commit-status.sh
