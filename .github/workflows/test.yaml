# CI of this repository: the lookup tests of the presets, then workflow-check,
# which builds the checks of the flake on both architectures. Weekly, because
# the lookup tests depend on the releases of what their fixtures pin.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  # Renovate reads the presets from GitHub, at the commit under test.
  lookup:
    name: Lookup tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@a90eeb051e85033f5d3c3e40dd213a585f34ec8d # v0.1.1
      - name: Look up updates with the presets of the commit
        shell: bash
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          nix run --no-update-lock-file .#check-lookup -- "$REF" tests/lookup/*/

  check:
    needs: [lookup]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@28f2432ff662691d085b9a29c4b8c858072faac1 # v0.1.1
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      flake: .
      expect-checks: '["formatting","presets","scripts"]'
      renovate-presets: '["flakeyard/renovate-config"]'
