# CI of this repository: the lookup tests of the presets and the pin of the
# shell library, then workflow-check, which builds the checks of the flake on
# both architectures. Weekly, because the lookup tests depend on the releases
# of what their fixtures pin.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)
  merge_group: # the merge queue

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  # Renovate reads the presets from GitHub, at the commit under test.
  lookup:
    name: Lookup tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@7c875dfd8963bdba2bae8a226df926912b4495e3 # v0.1.9
      - name: Look up updates with the presets of the commit
        shell: bash
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          nix run --no-update-lock-file .#check-lookup -- "$REF" tests/lookup/*/

  # The unit tests run in a check of the flake, which takes the shell library
  # at the commit of this step, so that the repository pins it once.
  shell-lib:
    name: Shell library
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: flakeyard/lib-actions@db9e3be2b6be4383c465ed6a0f996c1cf7870d1e # v0.1.0

  check:
    needs: [lookup, shell-lib]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@26bb51de7d33a21bfa420c1b75c645041dd227cf # v0.7.0
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      flake: .
      expect-checks: '["data-formats","markdown","nix","presets","scripts","shell","text","treefmt","workflows"]'
      # Weekly, the apps that need the network: the links of the Markdown files
      # and the online audits of the workflows.
      apps: ${{ github.event_name == 'schedule' && '["markdown-links","workflows-online"]' || '[]' }}
      renovate-presets: '["flakeyard/renovate-config"]'
      # The default configurations of the atoms apply (FY-0037).
      forbid-tool-configs: true
