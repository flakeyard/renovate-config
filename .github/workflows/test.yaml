# CI of this repository: the lookup tests of the presets and the pin of the
# shell library, then workflow-check, which builds the checks of the flake on
# both architectures. Weekly, because the lookup tests depend on the releases
# of what their fixtures pin.
name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  # Renovate reads the presets from GitHub, at the commit under test.
  lookup:
    name: Lookup tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: flakeyard/action-setup-nix@d9d2d2c4ab70b7829a12d6ad04bc9c1b350a9669 # v0.1.3
      - name: Look up updates with the presets of the commit
        shell: bash
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          nix run --no-update-lock-file .#check-lookup -- "$REF" tests/lookup/*/

  # The unit tests run in a check of the flake, which takes the shell library
  # at the commit of this step, so that the repository pins it once.
  shell-lib:
    name: Shell library
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: flakeyard/action-shell-lib@f49e13a81812082d44a37a1b585f8a69edb76d83 # v0.1.3

  check:
    needs: [lookup, shell-lib]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: flakeyard/workflow-check/.github/workflows/check.yaml@c92601f09c695dac2cdbb7fa1f09b559476ae78b # v0.3.1
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API, checkout
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      flake: .
      expect-checks: '["formatting","presets","scripts"]'
      renovate-presets: '["flakeyard/renovate-config"]'
